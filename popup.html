<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>crx 工具箱</title>
    <style>
      /* 亮色为基准，深色跟随系统主题覆盖 */
      :root {
        --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

        --surface: #ffffff;
        --row: #f8f9fb;
        --row-hover: #f1f3f7;
        --line: #e5e8ec;
        --ink: #1a1d21;
        --ink-dim: #6b7280;

        /* 级别色取自 DevTools 控制台对日志级别的惯用配色 */
        --live: #64748b;
        --mute: #c2c8d0;

        --log: #64748b;
        --info: #1a73e8;
        --warn: #b45309;
        --action: #e1251b;
        --ok: #1a7f4b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #16181c;
          --row: #1c1f24;
          --row-hover: #23262c;
          --line: #2a2e35;
          --ink: #e7e9ec;
          --ink-dim: #878e99;

          --live: #94a3b8;
          --mute: #565c66;

          --log: #94a3b8;
          --info: #6ea8ff;
          --warn: #f2b134;
          --action: #ff5a4d;
          --ok: #4ade80;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        padding: 14px;
      }

      /* 标题区 */
      .head h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
      }

      /* 功能分组：两块能力互不相干，用分组标题在界面上也把这件事挑明 */
      .group {
        margin-top: 14px;
      }

      .group + .group {
        margin-top: 18px;
      }

      .group-title {
        margin: 0 0 7px;
        color: var(--ink-dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      /* 通道组：三个日志级别共用一块面板，靠分隔线区分 */
      .channels {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--row);
        overflow: hidden;
      }

      .channel {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 12px 0 15px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .channel + .channel {
        border-top: 1px solid var(--line);
      }

      .channel:hover {
        background: var(--row-hover);
      }

      /* 信号条：有信号时亮起级别色，静音后瘪进去变灰 */
      .rail {
        position: absolute;
        left: 0;
        top: 50%;
        width: 3px;
        height: 18px;
        border-radius: 0 2px 2px 0;
        background: var(--live);
        transform: translateY(-50%);
        transition:
          background 0.2s ease,
          height 0.2s ease;
      }

      .name {
        position: relative;
        margin-right: auto;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: color 0.2s ease;
      }

      /* 签名元素：静音时划掉标识符，像被消音的那行日志 */
      .name::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.22s ease;
      }

      .switch {
        position: relative;
        flex: none;
        width: 32px;
        height: 18px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .track {
        position: absolute;
        inset: 0;
        border: 1px solid color-mix(in srgb, var(--live) 45%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--live) 20%, transparent);
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .track::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--live);
        transform: translateY(-50%);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      /* 开关打到右侧 = 已静音，此时整体转为安静的灰色 */
      .channel:has(input:checked) .rail {
        height: 8px;
        background: var(--mute);
      }

      .channel:has(input:checked) .name {
        color: var(--ink-dim);
      }

      .channel:has(input:checked) .name::after {
        transform: scaleX(1);
      }

      .channel:has(input:checked) .track {
        border-color: var(--line);
        background: transparent;
      }

      .channel:has(input:checked) .track::before {
        background: var(--mute);
        transform: translate(14px, -50%);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid var(--live);
        outline-offset: 2px;
      }

      /* 评价操作区：与日志通道分开，用京东红做唯一的重色 */
      .action {
        margin-top: 0;
      }

      #jdBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--row);
        color: var(--ink);
        font-family: var(--ui);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      #jdBtn:not(:disabled):hover {
        border-color: color-mix(in srgb, var(--action) 50%, var(--line));
        background: color-mix(in srgb, var(--action) 6%, var(--row));
      }

      #jdBtn:not(:disabled):active {
        transform: translateY(0.5px);
      }

      #jdBtn:focus-visible {
        outline: 2px solid var(--action);
        outline-offset: 2px;
      }

      /* 不在评价页时禁用：抽掉京东红，按钮不再许诺任何事 */
      #jdBtn:disabled {
        border-color: var(--line);
        background: transparent;
        color: var(--ink-dim);
        cursor: not-allowed;
      }

      /* AI 状态点：就一个圈，圈里 AI 两个字，只用边框颜色表意。
         绿 = 最近一次验证通过；黄 = 配了但没验过/没验过；未配置或 AI 关闭时整块不出现。
         刻意不做成可点的东西——AI 的开关与配置都在设置页。 */
      .ai-badge {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        border: 1.5px solid var(--mute);
        border-radius: 50%;
        color: var(--mute);
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      /* 类选择器的 display 会盖掉 UA 的 [hidden]，必须显式写回来 */
      .ai-badge[hidden] {
        display: none;
      }

      .ai-badge[data-state='unverified'] {
        border-color: var(--warn);
        color: var(--warn);
      }

      .ai-badge[data-state='ready'] {
        border-color: var(--ok);
        color: var(--ok);
      }

      .note {
        margin: 7px 0 0;
        color: var(--ink-dim);
        font-size: 11px;
        line-height: 1.4;
      }

      /* 仅供读屏器播报的开关状态，视觉状态由通道行本身表达 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <h1>crx 工具箱</h1>
      </header>

      <section class="group">
        <h2 class="group-title" id="consoleGroupTitle">控制台日志</h2>
        <div class="channels" role="group" aria-labelledby="consoleGroupTitle">
          <label class="channel" style="--live: var(--log)">
            <span class="rail" aria-hidden="true"></span>
            <span class="name">console.log</span>
            <span class="switch">
              <input type="checkbox" id="logToggle" role="switch" aria-label="静音 console.log" />
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="channel" style="--live: var(--info)">
            <span class="rail" aria-hidden="true"></span>
            <span class="name">console.info</span>
            <span class="switch">
              <input type="checkbox" id="infoToggle" role="switch" aria-label="静音 console.info" />
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="channel" style="--live: var(--warn)">
            <span class="rail" aria-hidden="true"></span>
            <span class="name">console.warn</span>
            <span class="switch">
              <input type="checkbox" id="warnToggle" role="switch" aria-label="静音 console.warn" />
              <span class="track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
        <p class="note">开关立即生效，并记住你的选择</p>
      </section>

      <section class="group">
        <h2 class="group-title">京东订单</h2>
        <div class="action">
          <button id="jdBtn">
            <span class="ai-badge" id="aiBadge" aria-hidden="true" hidden>AI</span>
            京东商品一键评价
          </button>
          <p class="note">仅在京东评价页生效</p>
        </div>
      </section>

      <div class="sr-only" aria-live="polite">
        <span id="logStatus">log: 已启用</span>
        <span id="infoStatus">info: 已启用</span>
        <span id="warnStatus">warn: 已启用</span>
        <span id="aiStatusText">AI 评语状态未知</span>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
